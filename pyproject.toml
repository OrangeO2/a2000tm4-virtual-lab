[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2000sim"
version = "0.1.0"
description = "A2000TM4 课程开发板无实物仿真实验台：TM1638/DAC6571/信号链参考模型与固件在环支持"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "a2000tm4-virtual-lab contributors" }]
keywords = ["tm4c1294", "tm1638", "renode", "renode-simulation", "tiva-c", "firmware-in-the-loop"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["a2000sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
